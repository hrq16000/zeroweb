name: SEO / JSON-LD

on:
  schedule:
    # Diariamente às 06:00 BRT (09:00 UTC) — após o ciclo de deploy noturno.
    - cron: "0 9 * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/routes/servicos*.tsx"
      - "src/routes/sitemap*.ts"
      - "src/lib/seo.ts"
      - "src/lib/services-*.ts"
      - "scripts/validate-jsonld.mjs"
      - "scripts/validate-sitemaps.mjs"
      - ".github/workflows/seo-jsonld.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base para validar (default: produção)"
        required: false
        default: "https://0web.com.br"
      with_validator:
        description: "Também rodar Schema.org Validator (mais lento)"
        required: false
        default: "true"

jobs:
  validate:
    name: Validate /servicos JSON-LD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar validador
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://0web.com.br' }}
          WITH_VALIDATOR: ${{ github.event.inputs.with_validator || 'true' }}
        run: |
          set -e
          if [ "$WITH_VALIDATOR" = "true" ]; then
            node scripts/validate-jsonld.mjs "$BASE_URL" --with-validator
          else
            node scripts/validate-jsonld.mjs "$BASE_URL"
          fi

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_id }}
          path: seo-reports/
          if-no-files-found: ignore
          retention-days: 30
